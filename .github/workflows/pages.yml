name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Actions Pages site
        id: detect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)"
          echo "build_type=${build}" >> "$GITHUB_OUTPUT"
          if [ "${build}" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Pages build_type is '${build}'. Actions deploy runs only when Source is GitHub Actions."
          fi

      - name: Configure Pages
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.detect.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.detect.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pages still needs a Settings change
        if: steps.detect.outputs.enabled != 'true'
        run: |
          echo "GitHub Pages is not deploying from Actions yet."
          echo "A repository admin opens Settings → Pages → Build and deployment."
          echo "Preferred: Source = GitHub Actions, then re-run this workflow."
          echo "Alternate: Source = Deploy from a branch, Branch = main, Folder = / (root), then Save."
